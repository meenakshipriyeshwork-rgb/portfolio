<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power &amp; Pleasure — Meenakshi Priyesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--black:#111110;--muted:#888882;--sans:'DM Sans',system-ui,sans-serif;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:#fff;color:var(--black);cursor:none;overflow-x:hidden;}
.cur-dot{width:8px;height:8px;background:var(--black);border-radius:50%;position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
.cur-ring{width:34px;height:34px;border:1.5px solid rgba(0,0,0,0.22);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .25s,height .25s,border-color .25s,background .25s;}
.cur-ring.hov{width:52px;height:52px;border-color:rgba(0,0,0,0.4);background:rgba(0,0,0,0.04);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:rgba(248,247,244,0.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,0.06);}
.nav-back{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:400;color:rgba(0,0,0,0.45);text-decoration:none;letter-spacing:0.01em;transition:color .2s;}
.nav-back:hover{color:var(--black);}
.nav-back svg{width:13px;height:13px;}
.nav-logo{font-family:'Permanent Marker',cursive;font-size:16px;color:var(--black);text-decoration:none;letter-spacing:0.02em;}
.nav-count{font-size:12px;color:rgba(0,0,0,0.3);letter-spacing:.06em;font-weight:400;}

/* INFO STRIP */
.info-strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(0,0,0,0.08);border-bottom:1px solid rgba(0,0,0,0.08);}
.info-cell{padding:28px 48px;border-right:1px solid rgba(0,0,0,0.08);}
.info-cell:last-child{border-right:none;}
.info-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.info-val{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--black);line-height:1.4;}

/* PANELS */
.sp-panels{display:flex;flex-direction:column;gap:0;}
.sp-panel{width:100%;overflow:hidden;}
.sp-panel img{display:block;width:100%;height:auto;}

/* PROJECT NAV */
.proj-nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 48px;background:rgba(248,247,244,0.96);border-top:1px solid rgba(0,0,0,0.06);}
.pn-prev,.pn-next{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:12px;color:rgba(0,0,0,0.5);letter-spacing:0.01em;transition:color .2s;}
.pn-next{justify-content:flex-end;}
.pn-dir{font-size:12px;letter-spacing:0.01em;color:rgba(0,0,0,0.45);}
.pn-title{font-size:12px;font-weight:500;color:rgba(0,0,0,0.7);transition:color .2s;}
.pn-prev:hover,.pn-next:hover{color:rgba(0,0,0,0.85);}
.pn-all{font-family:"Permanent Marker",cursive;font-size:16px;color:rgba(0,0,0,0.85);text-decoration:none;letter-spacing:0.02em;}
.pn-all:hover{opacity:0.6;}

@media(max-width:768px){
  nav{padding:0 20px;}
  .info-strip{grid-template-columns:repeat(2,1fr);}
  .info-cell{padding:20px 20px;}
  .proj-nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 48px;background:rgba(248,247,244,0.96);border-top:1px solid rgba(0,0,0,0.06);}
  .pn-all{font-family:"Permanent Marker",cursive;font-size:16px;color:rgba(0,0,0,0.85);text-decoration:none;letter-spacing:0.02em;}
}
</style>
</head>
<body>
<div class="cur-dot" id="curDot"></div>
<div class="cur-ring" id="curRing"></div>

<nav id="mainNav">
  <a href="gallery.html" class="nav-back">
    <svg viewBox="0 0 14 14" fill="none"><path d="M12 7H2M2 7L6 3M2 7L6 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Projects
  </a>
  <a href="index.html" class="nav-logo">MNKS</a>
  <span class="nav-count">04 / 11</span>
</nav>

<!-- Hero panel -->
<div class="sp-panels" style="margin-top:60px;">
  <div class="sp-panel">
    <img src="./images/projects/sparsh/image 1.png" alt="Sparsh hero">
  </div>
</div>

<!-- Info strip -->
<div class="info-strip">
  <div class="info-cell"><p class="info-label">Role</p><p class="info-val">Styling, Art Direction, Photography</p></div>
  <div class="info-cell"><p class="info-label">Tools</p><p class="info-val">Camera, Lightroom, Photoshop</p></div>
  <div class="info-cell"><p class="info-label">Type</p><p class="info-val">Magazine Shoot · Styling</p></div>
  <div class="info-cell"><p class="info-label">Year</p><p class="info-val">2024</p></div>
</div>

<!-- Remaining panels -->
<div class="sp-panels">

  <div class="sp-panel">
    <img src="./images/projects/sparsh/image 3.png" alt="Sparsh panel 3">
  </div>

  <div class="sp-panel">
    <img src="./images/projects/sparsh/gif 1.gif" alt="Sparsh gif">
  </div>

</div>

<!-- Behance CTA -->
<div style="text-align:center;padding:80px 48px;background:#111110;">
  <p style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:28px;">View the full project</p>
  <a href="https://www.behance.net/gallery/210859571/Styling-Dirty-Magazine" target="_blank" style="display:inline-flex;align-items:center;gap:10px;background:#fff;color:#111110;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;padding:16px 40px;border-radius:40px;text-decoration:none;letter-spacing:.03em;">See Sparsh on Behance ↗</a>
</div>

<!-- Project nav -->
<nav class="proj-nav">
  <a href="transcendence.html" class="pn-prev"><span class="pn-dir">← Previous</span><span class="pn-title">Transcendence</span></a>
  <a href="gallery.html" class="pn-all">All Projects</a>
  <a href="i-am-here.html" class="pn-next"><span class="pn-dir">Next →</span><span class="pn-title">i am here</span></a>
</nav>

<script>
(() => {
  const dot=document.getElementById('curDot'),ring=document.getElementById('curRing');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  (function loop(){dot.style.left=mx+'px';dot.style.top=my+'px';rx+=(mx-rx)*.13;ry+=(my-ry)*.13;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();
  document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>ring.classList.add('hov'));el.addEventListener('mouseleave',()=>ring.classList.remove('hov'));});

  const mainNav=document.getElementById('mainNav');
  let lastY=window.scrollY;
  window.addEventListener('scroll',()=>{
    const y=window.scrollY;
    if(y>lastY&&y>60){mainNav.style.transform='translateY(-100%)';}
    else{mainNav.style.transform='translateY(0)';}
    lastY=y;
  },{passive:true});
})();
</script>
</body>
</html>
